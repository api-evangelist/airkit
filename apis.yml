  Agentforce. As of this enrichment pass, www.airkit.com 301-redirects to salesforce.com/agentforce
  and the domain''s CAA records point to salesforce.com, so AirKit no longer operates an independent
  developer surface, API, documentation, or portal of its own — all first-party discovery URLs resolve
  into Salesforce properties. This profile is retained as an acquired-company record; enrichment beyond
  domain-level DNS/TLS evidence is not applicable.'
